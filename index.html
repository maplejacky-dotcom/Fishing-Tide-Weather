<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#06131d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="钓鱼天气">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>钓鱼潮汐天气公开版</title>
  <script src="pwa.js" defer></script>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #06131d;
      --bg-2: #0a1e2b;
      --panel: #0d2533;
      --panel-2: #102c3b;
      --line: #274656;
      --text: #f4f7f8;
      --muted: #a9bcc6;
      --gold: #f2c760;
      --gold-2: #d9a936;
      --cyan: #62d3e8;
      --green: #7bd8a1;
      --orange: #f5a95f;
      --red: #ff7f72;
      --shadow: 0 12px 28px rgba(0, 5, 10, .28);
      --radius-lg: 22px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #edf4f6;
        --bg-2: #dcebef;
        --panel: #ffffff;
        --panel-2: #f3f8f9;
        --line: #c2d5dc;
        --text: #0a2431;
        --muted: #4f6874;
        --gold: #9a6900;
        --gold-2: #b57d05;
        --cyan: #087f98;
        --green: #16794b;
        --orange: #a85710;
        --red: #b43d35;
        --shadow: 0 12px 28px rgba(22, 59, 75, .12);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -10%, rgba(98, 211, 232, .12), transparent 30rem),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    a { color: inherit; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom)); }
    .hero { padding: 10px 2px 22px; }
    .hero h1 { margin: 0; max-width: 760px; font-size: clamp(2rem, 8vw, 4.5rem); line-height: .98; letter-spacing: -.045em; font-weight: 800; }
    .hero h1 span { color: var(--gold); }
    .hero-row { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .intro { margin: 0; max-width: 670px; color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.18rem); }
    .lang-btn{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
    .freshness { display: inline-flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; color: var(--muted); font-size: .82rem; white-space: nowrap; }
    .freshness::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 16%, transparent); }
    .summary-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
    .summary-item { padding: 13px 14px; border-top: 1px solid var(--line); color: var(--muted); }
    .summary-item b { display: block; color: var(--text); font-size: 1.05rem; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin: 24px 0 12px; }
    .section-head h2 { margin: 0; font-size: clamp(1.3rem, 4.5vw, 2rem); letter-spacing: -.025em; }
    .section-head p { margin: 0; color: var(--muted); font-size: .88rem; text-align: right; }
    .spot-grid { display: grid; gap: 13px; }
    .spot-card {
      width: 100%; text-align: left; border: 1px solid var(--line); color: var(--text);
      background: linear-gradient(145deg, color-mix(in srgb, var(--panel-2) 88%, transparent), var(--panel));
      border-radius: var(--radius-lg); padding: 18px; cursor: pointer; box-shadow: var(--shadow);
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .spot-card:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); transform: translateY(-2px); }
    .spot-card:focus-visible, .back:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .card-top { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
    .rank { color: var(--gold); font-variant-numeric: tabular-nums; font-size: .82rem; font-weight: 750; }
    .spot-card h3 { margin: 2px 0 0; font-size: 1.22rem; letter-spacing: -.015em; }
    .station { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
    .score { flex: 0 0 auto; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--score-color, var(--gold)); background: color-mix(in srgb, var(--score-color, var(--gold)) 12%, transparent); }
    .score strong { font-size: 1.18rem; line-height: 1; }
    .score small { display: block; font-size: .62rem; color: var(--muted); line-height: 1; margin-top: 3px; }
    .card-primary { display: grid; grid-template-columns: 1.2fr .8fr; gap: 10px; align-items: end; margin-top: 18px; }
    .tide-now { color: var(--muted); font-size: .82rem; }
    .tide-now strong { display: block; color: var(--text); font-size: 2rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .next-tide { text-align: right; color: var(--muted); font-size: .78rem; }
    .next-tide b { display: block; color: var(--cyan); font-size: 1rem; }
    .metric-row { display: grid; grid-template-columns: 1.35fr .85fr .8fr; gap: 8px; margin-top: 15px; }
    .metric { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
    .metric span { display: block; color: var(--muted); font-size: .72rem; }
    .metric b { display: block; margin-top: 2px; font-size: .96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .metric b.wind-reading { font-size: .84rem; }
    .wind-arrow { display: inline-block; width: 1em; margin-right: .2em; color: var(--gold); font-style: normal; line-height: 1; text-align: center; transform: rotate(var(--wind-angle)); transform-origin: 50% 50%; }
    .gust-line { display: block; margin-top: 3px; color: var(--muted); font-size: .72rem; font-weight: 600; }
    .season-line { margin: 11px 0 0; color: var(--muted); font-size: .82rem; }
    .season-line strong { color: var(--gold); font-weight: 800; }
    .best-window { margin: 9px 0 0; color: var(--muted); font-size: .84rem; }
    .best-window b { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
    .fish-window { display: inline-block; margin-left: 8px; color: var(--gold); font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; }
    .recommend { margin: 9px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .84rem; }
    .detail { display: none; }
    .detail.active { display: block; }
    .home.hidden { display: none; }
    .back { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 9px 2px; color: var(--cyan); background: transparent; cursor: pointer; font-weight: 700; }
    .detail-hero { margin: 8px 0 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .detail-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .detail-title h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2.8rem); letter-spacing: -.04em; line-height: 1.05; }
    .detail-title p { margin: 5px 0 0; color: var(--muted); font-size: .8rem; }
    .detail-score { color: var(--gold); font-size: 2.1rem; font-weight: 850; line-height: 1; white-space: nowrap; }
    .detail-score small { display: block; color: var(--muted); font-size: .68rem; font-weight: 600; text-align: right; margin-top: 5px; }
    .now-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin-top: 18px; }
    .now-stat { padding: 14px; background: var(--panel-2); border-radius: var(--radius-md); min-width: 0; }
    .now-stat span { color: var(--muted); font-size: .74rem; }
    .now-stat b { display: block; margin-top: 4px; font-size: 1.28rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .advice { margin: 14px 0 0; color: var(--text); padding: 12px 0 0; border-top: 1px solid var(--line); }
    .advice small { color: var(--muted); }
    .panel { margin-top: 14px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); min-width: 0; }
    .panel h2 { margin: 0; font-size: 1.17rem; }
    .panel-sub { margin: 3px 0 14px; color: var(--muted); font-size: .78rem; }
    .fish-list { display: grid; }
    .fish-row { display: grid; grid-template-columns: 30px minmax(112px, .72fr) minmax(0, 1.6fr); gap: 10px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
    .fish-row:first-child { border-top: 0; padding-top: 2px; }
    .fish-rank { color: var(--gold); font-weight: 850; font-variant-numeric: tabular-nums; }
    .fish-name b { display: block; }
    .fish-name small, .fish-note { color: var(--muted); font-size: .78rem; }
    .fish-info { min-width: 0; }
    .fish-reg { display: block; color: var(--green); font-size: .82rem; font-weight: 760; line-height: 1.45; }
    .fish-reg.closed { color: var(--red); font-weight: 850; }
    .fish-reg.unknown { color: var(--muted); font-weight: 700; }
    .fish-reg-detail { display: block; margin-top: 2px; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .fish-note { display: block; margin-top: 3px; line-height: 1.45; }
    @media (max-width: 520px) { .fish-reg { font-size: .78rem; overflow-wrap: anywhere; } }
    .fish-footnote { margin: 10px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .75rem; line-height: 1.55; }
    .fish-footnote a { color: var(--cyan); text-underline-offset: 2px; }
    @media (max-width: 520px) {
      .fish-row { grid-template-columns: 24px minmax(0, 1fr); gap: 8px; }
      .fish-info { grid-column: 2; }
    }
    .date-strip {
      display: flex; gap: 8px; margin: 0 -4px 15px; padding: 4px;
      overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none;
      scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-chip {
      flex: 0 0 auto; min-width: 74px; min-height: 50px; padding: 7px 12px;
      border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
      background: var(--panel-2); cursor: pointer; scroll-snap-align: start;
      text-align: center; line-height: 1.2;
    }
    .date-chip b { display: block; color: var(--text); font-size: .86rem; }
    .date-chip small { display: block; margin-top: 4px; font-size: .7rem; }
    .date-chip[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
    .date-chip[aria-pressed="true"] b { color: var(--bg); }
    .date-chip:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .tide-empty { grid-column: 1 / -1; margin: 0; padding: 14px; color: var(--muted); background: var(--panel-2); border-radius: 11px; }
    .chart-wrap { position: relative; height: 260px; min-width: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    .legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: .72rem; }
    .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--cyan); }
    .legend i.gold { background: var(--gold); }
    .tide-table { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .tide-event { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 11px 12px; background: var(--panel-2); border-radius: 11px; }
    .tide-event b { color: var(--cyan); }
    .tide-event.high b { color: var(--gold); }
    .tide-event time { display: block; font-weight: 750; }
    .tide-event small { color: var(--muted); }
    .hour-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .hour { padding: 12px; border-top: 1px solid var(--line); min-width: 0; }
    .hour time { color: var(--gold); font-weight: 750; font-size: .83rem; }
    .hour-temp { display: block; font-size: 1.35rem; font-weight: 800; margin: 3px 0; }
    .hour small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .forecast { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .day { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 13px; background: var(--panel-2); border-radius: 12px; }
    .day-name { color: var(--gold); font-weight: 800; }
    .day-main b { display: block; }
    .day-main small { color: var(--muted); }
    .day-temp { text-align: right; font-variant-numeric: tabular-nums; }
    .day-temp b { font-size: 1.08rem; }
    .day-temp small { display: block; color: var(--muted); }
    .sun-moon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sun-moon div { text-align: center; padding: 13px 6px; background: var(--panel-2); border-radius: 12px; }
    .sun-moon span { color: var(--muted); font-size: .72rem; }
    .sun-moon b { display: block; margin-top: 4px; }
    .error { border: 1px solid color-mix(in srgb, var(--red) 55%, var(--line)); background: color-mix(in srgb, var(--red) 10%, var(--panel)); border-radius: var(--radius-lg); padding: 18px; }
    footer { margin: 28px 2px 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; }
    footer p { margin: 4px 0; }
    @media (min-width: 620px) {
      .shell { padding-inline: 24px; }
      .spot-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .spot-card:first-child { grid-column: span 2; }
      .now-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .tide-table { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .hour-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .forecast { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 940px) {
      .hero { padding-top: 30px; }
      .spot-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .spot-card:first-child { grid-column: span 1; }
      .detail-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; align-items: start; }
      .detail-layout .panel { margin-top: 0; }
      .chart-panel, .season-panel { grid-column: span 2; }
      .hour-grid { grid-template-columns: repeat(6, minmax(0,1fr)); }
      .forecast { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="home" class="home" aria-labelledby="main-title">
      <header class="hero">
        <h1 id="main-title" data-i18n="static_h1">今晚去哪钓？<br><span>先看潮、风和浪。</span></h1>
        <div class="hero-row">
          <p class="intro"><span data-i18n="static_intro_a">纽约、新泽西与罗德岛</span> <span id="pf-intro-count">9 个</span><span data-i18n="static_intro_b">海岸钓点的 7 天预报。综合潮势、风速和浪高，快速比较出钓条件。</span></p>
          <div id="freshness" class="freshness"></div><button id="lang-toggle" class="lang-btn" type="button">EN</button>
        </div>
      </header>
      <div class="summary-strip" aria-label="数据范围">
        <div class="summary-item"><b id="pf-count">9 个钓点</b><span data-i18n="static_compare">同屏比较</span></div>
        <div class="summary-item"><b data-i18n="static_48h">48 小时</b><span data-i18n="static_tidecurves">潮汐曲线</span></div>
        <div class="summary-item"><b data-i18n="static_7d">7 天</b><span data-i18n="static_marine">海况预报</span></div>
      </div>
      <div class="section-head">
        <h2 data-i18n="static_ranking">当前出钓排名</h2>
        <p data-i18n="static_ranking_sub">评分高的排在前面<br>点击卡片看详情</p>
      </div>
      <div id="spot-grid" class="spot-grid"></div>
    </section>

    <section id="detail" class="detail" aria-live="polite">
      <button id="back" class="back" type="button" data-i18n="static_back" aria-label="返回钓点比较">← 返回钓点比较</button>
      <div id="detail-content"></div>
    </section>

    <footer>
      <p id="updated-footer"></p>
      <p data-i18n="static_src">数据来源：NOAA Tides & Currents、Open-Meteo Weather 与 Marine Weather。</p>
      <p data-i18n="static_disclaimer">打开时自动获取最新数据；潮汐、天气与出钓评分仅供参考，请留意现场警报和海况。</p>
    </footer>
  </main>

  <style>
/* Visitor-feature styles: toolbar, sort switch, sheets, rows */
.pf-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.pf-sort{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.pf-sort button{border:0;background:transparent;color:var(--muted);padding:8px 16px;font-size:.9rem;cursor:pointer}
.pf-sort button.on{background:var(--gold);color:#0a2431;font-weight:700}
.pf-tools{display:flex;gap:8px}
.pf-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:9px 14px;font-size:.92rem;cursor:pointer}
.pf-btn:disabled{opacity:.45;cursor:default}
.pf-btn.pf-primary{background:var(--gold);border-color:var(--gold);color:#0a2431;font-weight:700}
.pf-btn.pf-ghost{background:transparent}
.pf-btn.pf-small{padding:6px 10px;font-size:.82rem}
.pf-btn.pf-danger{background:var(--red);border-color:var(--red);color:#0a2431;font-weight:700}
.pf-btn.pf-danger-link{background:transparent;border:0;color:var(--red);padding:9px 4px}
.pf-backdrop{position:fixed;inset:0;background:rgba(2,10,16,.62);z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.pf-backdrop{align-items:center;padding:24px}}
.pf-sheet{background:var(--bg-2);color:var(--text);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px}
@media(min-width:640px){.pf-sheet{border-radius:20px}}
.pf-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.pf-head .eyebrow{color:var(--gold);font-size:.78rem;letter-spacing:.08em;margin:0 0 2px}
.pf-head h2{margin:0;font-size:1.3rem}
.pf-close{border:1px solid var(--line);background:transparent;color:var(--text);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer}
.pf-field{display:block;margin:10px 0}
.pf-field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pf-field input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:1rem}
.pf-tabs{display:flex;gap:6px;margin:12px 0}
.pf-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 4px;font-size:.85rem;cursor:pointer}
.pf-tabs button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.pf-pane{margin-bottom:6px}
.pf-row{display:flex;gap:8px}
.pf-row input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:1rem;min-width:0}
.pf-col{display:flex;flex-direction:column;gap:10px}
.pf-coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-results{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pf-place-btn{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer}
.pf-place-btn strong{display:block}
.pf-place-btn span{font-size:.82rem;color:var(--muted)}
.pf-note{font-size:.85rem;color:var(--muted);margin:10px 0}
.pf-loc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}

function __haversineKm(a, b, c, d) {

function __openManageAll() {

      row.innerHTML =
        T("<div class=\"pf-order-btns\"><button type=\"button\" aria-label=\"上移 ") + esc(meta.name) + '"' + (idx === 0 ? ' disabled' : '') + '>\u2191</button>' +

        '<div class="pf-row-act"></div>';
      const [up, down] = row.querySelectorAll('.pf-order-btns button');
      up.addEventListener('click', () => moveSpot(idx, -1));

      const act = row.querySelector('.pf-row-act');
      if (meta.isCustom) {
        const b = document.createElement('button');

        b.addEventListener('click', () => __openManageSpot(id));
        act.appendChild(b);
      } else {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pf-visibility' + (hidden ? '' : ' on');
        b.setAttribute('role', 'switch');
        b.setAttribute('aria-checked', String(!hidden));
        b.setAttribute('aria-label', (hidden ? T("显示 ") : T("隐藏 ")) + meta.name);
        b.innerHTML = '<span aria-hidden="true"></span><b>' + (hidden ? T("已隐藏") : T("显示中")) + '</b>';
        b.addEventListener('click', async () => {
          if (hidden) PF.hidden = PF.hidden.filter(x => x !== id);
          else PF.hidden.push(id);
          __pfSave();
          __pfMsg(bd, '', true);
          paintRows();
          await __refreshSpots();
          __openManageAll();
        });
        act.appendChild(b);
      }
      box.appendChild(row);
    });

  function moveSpot(idx, dirn) {
    const t = idx + dirn;
    if (t < 0 || t >= PF.order.length) return;

    paintRows();
    renderHome();
  }
  paintRows();
}

const __CACHE_KEY='fishing_public_live_v4';
const __CACHE_TTL=3600*1000;
function __etParts(d){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const o={}; for(const x of p) o[x.type]=x.value; return o;
}
function __ymd(d){ const o=__etParts(d); return o.year+o.month+o.day; }
function __etISO(d){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);
  const o={}; for(const x of p) o[x.type]=x.value;
  return o.year+'-'+o.month+'-'+o.day+'T'+o.hour+':'+o.minute+':'+o.second;
}
function __readCache(){
  try{
    if(typeof localStorage==='undefined') return null;
    const raw=localStorage.getItem(__CACHE_KEY); if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function __saveCache(data,key){
  try{ if(typeof localStorage!=='undefined') localStorage.setItem(__CACHE_KEY,JSON.stringify({savedAt:Date.now(),key,data})); }catch(e){}
}
async function __fetchJSON(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status+' '+url);
  return r.json();
}
function __noaaURL(station,beginYMD,endYMD,interval){
  const p=new URLSearchParams({product:'predictions',application:'NOS.COOPS.TAC.WL',begin_date:beginYMD,end_date:endYMD,datum:'MLLW',station:station,time_zone:'lst_ldt',units:'english',interval:interval,format:'json'});
  return 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?'+p.toString();
}
function __tmin(s){ return Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),+s.slice(11,13),+s.slice(14,16))/60000; }
function __fmtBack(m){
  const d=new Date(m*60000), p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());
}
function __interpHourly(hilo,dayYMD){
  const pts=hilo.map(p=>({m:__tmin(p.t),v:parseFloat(p.v)})).sort((a,b)=>a.m-b.m);
  const startM=__tmin(dayYMD.slice(0,4)+'-'+dayYMD.slice(4,6)+'-'+dayYMD.slice(6,8)+' 00:00');
  const out=[];
  for(let n=0;n<168;n++){
    const m=startM+n*60;
    let a,b;
    if(m<=pts[0].m){ a=pts[0]; b=pts[1]; }
    else if(m>=pts[pts.length-1].m){ a=pts[pts.length-2]; b=pts[pts.length-1]; }
    else{ for(let k=0;k<pts.length-1;k++){ if(pts[k].m<=m&&m<=pts[k+1].m){ a=pts[k]; b=pts[k+1]; break; } } }
    const frac=(m-a.m)/(b.m-a.m);
    const v=a.v+(b.v-a.v)*(1-Math.cos(Math.PI*frac))/2;
    out.push({t:__fmtBack(m),v:v.toFixed(3)});
  }
  return out;
}

    function seaTemperatureForDate(spot,date) {
      const hourly = spot.marine?.hourly;
      if (!hourly) return NaN;
      const values = hourly.time.reduce((result,time,index) => {
        const value = Number(hourly.sea_surface_temperature[index]);
        if (time.slice(0,10) === date && Number.isFinite(value)) result.push(value);
        return result;
      },[]);
      return values.length ? values.reduce((sum,value) => sum + value,0) / values.length : NaN;
    }
    function seasonalFish(spot,date) {
      const month = Number(date.slice(5,7));
      const sea = seaTemperatureForDate(spot,date);
      return FISH_SPECIES.map((fish,order) => {
        const inSeason = fish.months.includes(month);
        const nearSeason = fish.months.some(peakMonth => {
          const previous = peakMonth === 1 ? 12 : peakMonth - 1;
          const next = peakMonth === 12 ? 1 : peakMonth + 1;
          return month === previous || month === next;
        });
        const seasonalScore = inSeason ? 2 : (nearSeason ? 1 : 0);
        let temperatureScore = 0;
        if (Number.isFinite(sea)) {
          if (sea >= fish.temp[0] && sea <= fish.temp[1]) temperatureScore = 2;
          else if (sea >= fish.temp[0] - 5 && sea <= fish.temp[1] + 5) temperatureScore = 1;
        }
        return {...fish,score:seasonalScore + temperatureScore,order};
      }).sort((a,b) => b.score - a.score || a.order - b.order);
    }
    function spotState(spot) {
      if (spot.regulationState) return spot.regulationState;
      if (spot.name === 'Newport, RI') return 'RI';
      if (spot.name === 'Sandy Hook, NJ' || spot.name === 'Atlantic City, NJ' || spot.name === 'Belmar 飞机石') return 'NJ';
      return 'NY';

    function dateInSeason(date,start,end) {
      const md = date.slice(5,10);
      return md >= start && md <= end;

    function regulationFor(spot,fish,date) {
      const state = spotState(spot);
      const rule = FISH_REGULATIONS[state][fish.name];
      if (!rule || rule.officialOnly) return {kind:'unknown',text:T("详见官网")};
      if (rule.yearRound) return {kind:'open',text:`${T("合法")} ${rule.size} ${T("·")} ${T("日限")}${rule.bag}`,detail:rule.detail};
      const season = rule.seasons.find(item => dateInSeason(date,item.start,item.end));
      if (season) return {kind:'open',text:`${T("合法")} ${season.size || rule.size} ${T("·")} ${T("日限")}${season.bag}${T("（")}${season.label}${T("）")}`,detail:rule.detail};
      const closedDetail = rule.closedSummary || `${T("合法")} ${rule.size || rule.seasons.map(item => item.size).filter(Boolean).join('/')} ${T("·")} ${rule.seasons.map(item => `$${T("日限")}tem.label} 日限${item.bag}`).join('；')}`;
      return {kind:'closed',text:T("休渔期"),detail:closedDetail};

    function moonPhase(dateString) {
      const date = new Date(`${dateString}T12:00:00-04:00`);
      const known = new Date('2000-01-06T18:14:00Z');
      const days = (date - known) / 86400000;
      const phase = ((days % 29.53058867) + 29.53058867) % 29.53058867;
      const fraction = phase / 29.53058867;
      if (fraction < .03 || fraction >= .97) return T("新月");
      if (fraction < .22) return T("娥眉月");
      if (fraction < .28) return T("上弦月");
      if (fraction < .47) return T("盈凸月");
      if (fraction < .53) return T("满月");
      if (fraction < .72) return T("亏凸月");
      if (fraction < .78) return T("下弦月");
      return T("残月");
    }
    function solunar(dateString) {
      const date = new Date(`${dateString}T12:00:00-04:00`);
      const known = new Date('2000-01-06T18:14:00Z');
      const age = (((date - known) / 86400000) % 29.53058867 + 29.53058867) % 29.53058867;
      const transit = (12 + age * .8412) % 24;
      const fmt = h => { h = ((h % 24) + 24) % 24; return `${Math.floor(h)}:${String(Math.floor((h % 1) * 60)).padStart(2,'0')}`; };
      const span = (center, half) => `${fmt(center - half)}–${fmt(center + half)}`;
      const mk = (center, half) => { const s = (((center - half) % 24) + 24) % 24; return [s, s + half * 2]; };
      return {major:[span(transit,1), span(transit + 12.42,1)], minor:[span(transit - 6.21,.5), span(transit + 6.21,.5)],
        majorSpans:[mk(transit,1), mk(transit + 12.42,1)], minorSpans:[mk(transit - 6.21,.5), mk(transit + 6.21,.5)]};
    }
    function weekday(date) {
      const names = [T("周日"),T("周一"),T("周二"),T("周三"),T("周四"),T("周五"),T("周六")];
      return names[new Date(`${date}T12:00:00-04:00`).getUTCDay()];
    }
    function dayLabel(date, index) {

      return events.map(x => `<div class="tide-event ${x.type === 'H' ? 'high' : ''}">

    function dayAdvice(spot, date, index) {
      const weather = spot.weather.hourly;
      const marine = spot.marine.hourly;
      const wi = weather.time.map((t,i) => t.slice(0,10) === date ? i : -1).filter(i => i >= 0);
      const mi = marine.time.map((t,i) => t.slice(0,10) === date ? i : -1).filter(i => i >= 0);
      const maxOf = (values, indices) => {
        const nums = indices.map(i => Number(values[i])).filter(Number.isFinite);
        return nums.length ? Math.max(...nums) : 0;
      };
      const wind = maxOf(weather.wind_speed_10m,wi);
      const gust = maxOf(weather.wind_gusts_10m || [],wi);
      const rain = maxOf(weather.precipitation_probability,wi);
      const wave = maxOf(marine.wave_height,mi);
      let score = 92;
      score -= Math.max(0,wind-8)*2.1;
      score -= Math.max(0,gust-18)*1.15;
      score -= Math.max(0,wave-1.5)*10;
      score -= rain*.09;
      score = Math.max(20,Math.min(98,Math.round(score)));
      const label = index === 0 ? T("今天") : `${Number(date.slice(5,7))}${T("月")}${Number(date.slice(8,10))}${T("日")}`;
      let advice;
      if (wind >= 20 || wave >= 5) advice = `${label}${T("风浪偏大，建议改期或选择避风岸线。")}`;
      else if (score >= 78) advice = `${label}${T("风浪温和，适合关注高潮前后的窗口。")}`;

      else advice = `${label}${T("条件一般，近岸作钓也请先观察现场风浪。")}`;
      return {score,advice};

        <section class="panel"><h2>${T("当天高低潮")}</h2><p class="panel-sub">${weekday(selectedDate)} ${T("·")} ${T("美国东部时间")}</p><div class="tide-table">${makeTideEvents(spot,selectedDate)}</div><p class="best-window">${T("最佳出钓窗口")} <b>${bwSel ? bwSel.label : T("暂无")}</b>${bwSel && bwSel.secondLabel ? ` ${T("·")} ${T("次佳")} <b>${bwSel.secondLabel}</b>` : ''} <span style="color:var(--muted)">${T("·")} ${T("潮汐·风浪·气压·鱼口综合")}</span></p></section>
        <section class="panel"><h2>${T("今天的光照与月相")}</h2><p class="panel-sub">${T("适合安排清晨和傍晚窗口")}</p><div class="sun-moon"><div><span>${T("日出")}</span><b>${timeOnly(daily.sunrise[0])}</b></div><div><span>${T("日落")}</span><b>${timeOnly(daily.sunset[0])}</b></div><div><span>${T("月相")}</span><b>${moonPhase(daily.time[0])}</b></div></div></section>
        <section class="panel"><h2>${T("鱼口活跃时段")}</h2><p class="panel-sub">${Number(selectedDate.slice(5,7))}${T("月")}${Number(selectedDate.slice(8,10))}${T("日")} ${T("·")} ${moonPhase(selectedDate)} ${T("·")} ${T("天文估算，仅供参考")}</p><div class="sun-moon"><div><span>${T("大咬口")}</span><b>${sol.major[0]}</b></div><div><span>${T("大咬口")}</span><b>${sol.major[1]}</b></div><div><span>${T("小咬口")}</span><b>${sol.minor[0]}</b></div><div><span>${T("小咬口")}</span><b>${sol.minor[1]}</b></div></div></section>
        <section class="panel season-panel"><h2>${T("时令鱼种参考")}</h2><p class="panel-sub">${Number(selectedDate.slice(5,7))}${T("月")}${Number(selectedDate.slice(8,10))}${T("日")} ${T("·")} ${spotState(spot)} ${T("法规")} ${T("·")} ${T("当天平均海温")} ${Number.isFinite(selectedSea) ? `${n(selectedSea,0)}°F` : T("暂无")}</p><div class="fish-list">${makeFishList(spot,selectedDate)}</div><p class="fish-footnote">${T("根据季节与水温推测，仅供参考。")}${regulationSources()}</p></section>
      </div>
      <section class="panel"><h2>${T("未来")} 24 ${T("小时")}</h2><p class="panel-sub">${T("逐小时天气、风、浪、涌浪和海水温度")}</p><div class="hour-grid">${makeHours(spot,d)}</div></section>
      <section class="panel"><h2>7 ${T("天预报")}</h2><p class="panel-sub">${T("每日最高")} / ${T("最低气温与最大风速")}</p><div class="forecast">${makeForecast(spot)}</div></section>`;
      document.getElementById('home').classList.add('hidden');
      document.getElementById('detail').classList.add('active');
      document.querySelectorAll('.date-chip').forEach(chip => chip.addEventListener('click',() => showDetail(index,Number(chip.dataset.dayIndex),false)));
      if (shouldScroll) window.scrollTo({top:0,behavior:'instant'});
      drawTideChart(spot,selectedDate);
      requestAnimationFrame(() => {
        const strip = document.querySelector('.date-strip');
        const selected = strip?.querySelector('[aria-pressed="true"]');
        if (strip && selected) strip.scrollLeft = selected.offsetLeft - strip.clientWidth/2 + selected.clientWidth/2;
      });
    }
    function showHome() {
      document.getElementById('detail').classList.remove('active');
      document.getElementById('home').classList.remove('hidden');
      if (activeChartResize) { window.removeEventListener('resize', activeChartResize); activeChartResize = null; }
      window.scrollTo({top:0,behavior:'instant'});
    }

    function drawTideChart(spot,date) {
      const canvas = document.getElementById('tide-chart');
      const series = spot.tide.hourly.filter(point => point.t.slice(0,10) === date);
      if (!canvas || series.length < 2) return;
      const draw = () => {
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width*ratio));
        canvas.height = Math.max(1, Math.round(rect.height*ratio));
        const ctx = canvas.getContext('2d'); ctx.scale(ratio,ratio);
        const w=rect.width,h=rect.height,p={l:38,r:12,t:18,b:32};
        const vals=series.map(x=>Number(x.v)); const min=Math.min(...vals)-.35,max=Math.max(...vals)+.35;
        const x=i=>p.l+i*(w-p.l-p.r)/(series.length-1); const y=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min);
        const style=getComputedStyle(document.documentElement); const line=style.getPropertyValue('--line').trim(); const muted=style.getPropertyValue('--muted').trim(); const cyan=style.getPropertyValue('--cyan').trim(); const gold=style.getPropertyValue('--gold').trim();
        ctx.clearRect(0,0,w,h); ctx.font='11px ui-sans-serif'; ctx.fillStyle=muted; ctx.strokeStyle=line; ctx.lineWidth=1;
        for(let i=0;i<=3;i++){const value=min+(max-min)*i/3,yy=y(value);ctx.beginPath();ctx.moveTo(p.l,yy);ctx.lineTo(w-p.r,yy);ctx.stroke();ctx.fillText(`${value.toFixed(1)} ft`,0,yy+4);}
        for(let i=0;i<series.length;i+=6){ctx.fillText(series[i].t.slice(11,16),Math.max(p.l,x(i)-12),h-8);}
        const grad=ctx.createLinearGradient(0,p.t,0,h-p.b);grad.addColorStop(0,'rgba(98,211,232,.28)');grad.addColorStop(1,'rgba(98,211,232,.02)');
        ctx.beginPath(); series.forEach((pt,i)=>{const xx=x(i),yy=y(Number(pt.v));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}); ctx.lineTo(x(series.length-1),h-p.b);ctx.lineTo(x(0),h-p.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
        ctx.beginPath(); series.forEach((pt,i)=>{const xx=x(i),yy=y(Number(pt.v));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.strokeStyle=cyan;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
        const start=new Date(series[0].t.replace(' ','T')); const end=new Date(series[series.length-1].t.replace(' ','T'));
        spot.tide.hilo.forEach(ev=>{const dt=new Date(ev.t.replace(' ','T'));if(dt<start||dt>end)return;const pos=(dt-start)/(end-start)*(series.length-1);ctx.beginPath();ctx.arc(x(pos),y(Number(ev.v)),4.5,0,Math.PI*2);ctx.fillStyle=ev.type==='H'?gold:cyan;ctx.fill();});
      };
      draw();
      if (activeChartResize) window.removeEventListener('resize',activeChartResize);
      activeChartResize = draw;
      window.addEventListener('resize',draw,{passive:true});
    }

    document.getElementById('back').addEventListener('click',showHome);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('detail').classList.contains('active'))showHome();});
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    applyStaticI18n();
    const __lt = document.getElementById('lang-toggle');
    if (__lt) { __lt.textContent = LANG === 'en' ? '中文' : 'EN'; __lt.addEventListener('click', () => setLang(LANG === 'en' ? 'zh' : 'en')); }
    __initPublicFeatures();
    renderHome();
  
})();
</script>
</body>
</html>
