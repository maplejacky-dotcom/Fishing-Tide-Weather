<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>钓鱼潮汐天气公开版</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #06131d;
      --bg-2: #0a1e2b;
      --panel: #0d2533;
      --panel-2: #102c3b;
      --line: #274656;
      --text: #f4f7f8;
      --muted: #a9bcc6;
      --gold: #f2c760;
      --gold-2: #d9a936;
      --cyan: #62d3e8;
      --green: #7bd8a1;
      --orange: #f5a95f;
      --red: #ff7f72;
      --shadow: 0 12px 28px rgba(0, 5, 10, .28);
      --radius-lg: 22px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #edf4f6;
        --bg-2: #dcebef;
        --panel: #ffffff;
        --panel-2: #f3f8f9;
        --line: #c2d5dc;
        --text: #0a2431;
        --muted: #4f6874;
        --gold: #9a6900;
        --gold-2: #b57d05;
        --cyan: #087f98;
        --green: #16794b;
        --orange: #a85710;
        --red: #b43d35;
        --shadow: 0 12px 28px rgba(22, 59, 75, .12);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -10%, rgba(98, 211, 232, .12), transparent 30rem),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    a { color: inherit; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom)); }
    .hero { padding: 10px 2px 22px; }
    .hero h1 { margin: 0; max-width: 760px; font-size: clamp(2rem, 8vw, 4.5rem); line-height: .98; letter-spacing: -.045em; font-weight: 800; }
    .hero h1 span { color: var(--gold); }
    .hero-row { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .intro { margin: 0; max-width: 670px; color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.18rem); }
    .freshness { display: inline-flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; color: var(--muted); font-size: .82rem; white-space: nowrap; }
    .freshness::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 16%, transparent); }
    .summary-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
    .summary-item { padding: 13px 14px; border-top: 1px solid var(--line); color: var(--muted); }
    .summary-item b { display: block; color: var(--text); font-size: 1.05rem; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin: 24px 0 12px; }
    .section-head h2 { margin: 0; font-size: clamp(1.3rem, 4.5vw, 2rem); letter-spacing: -.025em; }
    .section-head p { margin: 0; color: var(--muted); font-size: .88rem; text-align: right; }
    .spot-grid { display: grid; gap: 13px; }
    .spot-card {
      width: 100%; text-align: left; border: 1px solid var(--line); color: var(--text);
      background: linear-gradient(145deg, color-mix(in srgb, var(--panel-2) 88%, transparent), var(--panel));
      border-radius: var(--radius-lg); padding: 18px; cursor: pointer; box-shadow: var(--shadow);
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .spot-card:hover { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); transform: translateY(-2px); }
    .spot-card:focus-visible, .back:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .card-top { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
    .rank { color: var(--gold); font-variant-numeric: tabular-nums; font-size: .82rem; font-weight: 750; }
    .spot-card h3 { margin: 2px 0 0; font-size: 1.22rem; letter-spacing: -.015em; }
    .station { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
    .score { flex: 0 0 auto; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--score-color, var(--gold)); background: color-mix(in srgb, var(--score-color, var(--gold)) 12%, transparent); }
    .score strong { font-size: 1.18rem; line-height: 1; }
    .score small { display: block; font-size: .62rem; color: var(--muted); line-height: 1; margin-top: 3px; }
    .card-primary { display: grid; grid-template-columns: 1.2fr .8fr; gap: 10px; align-items: end; margin-top: 18px; }
    .tide-now { color: var(--muted); font-size: .82rem; }
    .tide-now strong { display: block; color: var(--text); font-size: 2rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .next-tide { text-align: right; color: var(--muted); font-size: .78rem; }
    .next-tide b { display: block; color: var(--cyan); font-size: 1rem; }
    .metric-row { display: grid; grid-template-columns: 1.35fr .85fr .8fr; gap: 8px; margin-top: 15px; }
    .metric { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
    .metric span { display: block; color: var(--muted); font-size: .72rem; }
    .metric b { display: block; margin-top: 2px; font-size: .96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .metric b.wind-reading { font-size: .84rem; }
    .wind-arrow { display: inline-block; width: 1em; margin-right: .2em; color: var(--gold); font-style: normal; line-height: 1; text-align: center; transform: rotate(var(--wind-angle)); transform-origin: 50% 50%; }
    .gust-line { display: block; margin-top: 3px; color: var(--muted); font-size: .72rem; font-weight: 600; }
    .season-line { margin: 11px 0 0; color: var(--muted); font-size: .82rem; }
    .season-line strong { color: var(--gold); font-weight: 800; }
    .recommend { margin: 9px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .84rem; }
    .detail { display: none; }
    .detail.active { display: block; }
    .home.hidden { display: none; }
    .back { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 9px 2px; color: var(--cyan); background: transparent; cursor: pointer; font-weight: 700; }
    .detail-hero { margin: 8px 0 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .detail-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .detail-title h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2.8rem); letter-spacing: -.04em; line-height: 1.05; }
    .detail-title p { margin: 5px 0 0; color: var(--muted); font-size: .8rem; }
    .detail-score { color: var(--gold); font-size: 2.1rem; font-weight: 850; line-height: 1; white-space: nowrap; }
    .detail-score small { display: block; color: var(--muted); font-size: .68rem; font-weight: 600; text-align: right; margin-top: 5px; }
    .now-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin-top: 18px; }
    .now-stat { padding: 14px; background: var(--panel-2); border-radius: var(--radius-md); min-width: 0; }
    .now-stat span { color: var(--muted); font-size: .74rem; }
    .now-stat b { display: block; margin-top: 4px; font-size: 1.28rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .advice { margin: 14px 0 0; color: var(--text); padding: 12px 0 0; border-top: 1px solid var(--line); }
    .advice small { color: var(--muted); }
    .panel { margin-top: 14px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); min-width: 0; }
    .panel h2 { margin: 0; font-size: 1.17rem; }
    .panel-sub { margin: 3px 0 14px; color: var(--muted); font-size: .78rem; }
    .fish-list { display: grid; }
    .fish-row { display: grid; grid-template-columns: 30px minmax(112px, .72fr) minmax(0, 1.6fr); gap: 10px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
    .fish-row:first-child { border-top: 0; padding-top: 2px; }
    .fish-rank { color: var(--gold); font-weight: 850; font-variant-numeric: tabular-nums; }
    .fish-name b { display: block; }
    .fish-name small, .fish-note { color: var(--muted); font-size: .78rem; }
    .fish-info { min-width: 0; }
    .fish-reg { display: block; color: var(--green); font-size: .82rem; font-weight: 760; line-height: 1.45; }
    .fish-reg.closed { color: var(--red); font-weight: 850; }
    .fish-reg.unknown { color: var(--muted); font-weight: 700; }
    .fish-reg-detail { display: block; margin-top: 2px; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .fish-note { display: block; margin-top: 3px; line-height: 1.45; }
    @media (max-width: 520px) { .fish-reg { font-size: .78rem; overflow-wrap: anywhere; } }
    .fish-footnote { margin: 10px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .75rem; line-height: 1.55; }
    .fish-footnote a { color: var(--cyan); text-underline-offset: 2px; }
    @media (max-width: 520px) {
      .fish-row { grid-template-columns: 24px minmax(0, 1fr); gap: 8px; }
      .fish-info { grid-column: 2; }
    }
    .date-strip {
      display: flex; gap: 8px; margin: 0 -4px 15px; padding: 4px;
      overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none;
      scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-chip {
      flex: 0 0 auto; min-width: 74px; min-height: 50px; padding: 7px 12px;
      border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
      background: var(--panel-2); cursor: pointer; scroll-snap-align: start;
      text-align: center; line-height: 1.2;
    }
    .date-chip b { display: block; color: var(--text); font-size: .86rem; }
    .date-chip small { display: block; margin-top: 4px; font-size: .7rem; }
    .date-chip[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
    .date-chip[aria-pressed="true"] b { color: var(--bg); }
    .date-chip:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .tide-empty { grid-column: 1 / -1; margin: 0; padding: 14px; color: var(--muted); background: var(--panel-2); border-radius: 11px; }
    .chart-wrap { position: relative; height: 260px; min-width: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    .legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: .72rem; }
    .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--cyan); }
    .legend i.gold { background: var(--gold); }
    .tide-table { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .tide-event { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 11px 12px; background: var(--panel-2); border-radius: 11px; }
    .tide-event b { color: var(--cyan); }
    .tide-event.high b { color: var(--gold); }
    .tide-event time { display: block; font-weight: 750; }
    .tide-event small { color: var(--muted); }
    .hour-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .hour { padding: 12px; border-top: 1px solid var(--line); min-width: 0; }
    .hour time { color: var(--gold); font-weight: 750; font-size: .83rem; }
    .hour-temp { display: block; font-size: 1.35rem; font-weight: 800; margin: 3px 0; }
    .hour small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .forecast { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .day { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 13px; background: var(--panel-2); border-radius: 12px; }
    .day-name { color: var(--gold); font-weight: 800; }
    .day-main b { display: block; }
    .day-main small { color: var(--muted); }
    .day-temp { text-align: right; font-variant-numeric: tabular-nums; }
    .day-temp b { font-size: 1.08rem; }
    .day-temp small { display: block; color: var(--muted); }
    .sun-moon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sun-moon div { text-align: center; padding: 13px 6px; background: var(--panel-2); border-radius: 12px; }
    .sun-moon span { color: var(--muted); font-size: .72rem; }
    .sun-moon b { display: block; margin-top: 4px; }
    .error { border: 1px solid color-mix(in srgb, var(--red) 55%, var(--line)); background: color-mix(in srgb, var(--red) 10%, var(--panel)); border-radius: var(--radius-lg); padding: 18px; }
    footer { margin: 28px 2px 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; }
    footer p { margin: 4px 0; }
    @media (min-width: 620px) {
      .shell { padding-inline: 24px; }
      .spot-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .spot-card:first-child { grid-column: span 2; }
      .now-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .tide-table { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .hour-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .forecast { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 940px) {
      .hero { padding-top: 30px; }
      .spot-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .spot-card:first-child { grid-column: span 1; }
      .detail-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; align-items: start; }
      .detail-layout .panel { margin-top: 0; }
      .chart-panel, .season-panel { grid-column: span 2; }
      .hour-grid { grid-template-columns: repeat(6, minmax(0,1fr)); }
      .forecast { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="home" class="home" aria-labelledby="main-title">
      <header class="hero">
        <h1 id="main-title">今晚去哪钓？<br><span>先看潮、风和浪。</span></h1>
        <div class="hero-row">
          <p class="intro">纽约、新泽西与罗德岛 <span id="pf-intro-count">9 个</span>海岸钓点的 7 天预报。综合潮势、风速和浪高，快速比较出钓条件。</p>
          <div id="freshness" class="freshness"></div>
        </div>
      </header>
      <div class="summary-strip" aria-label="数据范围">
        <div class="summary-item"><b id="pf-count">9 个钓点</b>同屏比较</div>
        <div class="summary-item"><b>48 小时</b>潮汐曲线</div>
        <div class="summary-item"><b>7 天</b>海况预报</div>
      </div>
      <div class="section-head">
        <h2>当前出钓排名</h2>
        <p>评分高的排在前面<br>点击卡片看详情</p>
      </div>
      <div id="spot-grid" class="spot-grid"></div>
    </section>

    <section id="detail" class="detail" aria-live="polite">
      <button id="back" class="back" type="button" aria-label="返回钓点比较">← 返回钓点比较</button>
      <div id="detail-content"></div>
    </section>

    <footer>
      <p id="updated-footer"></p>
      <p>数据来源：NOAA Tides & Currents、Open-Meteo Weather 与 Marine Weather。</p>
      <p>打开时自动获取最新数据；潮汐、天气与出钓评分仅供参考，请留意现场警报和海况。</p>
    </footer>
  </main>

  <style>
/* Visitor-feature styles: toolbar, sort switch, sheets, rows */
.pf-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.pf-sort{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.pf-sort button{border:0;background:transparent;color:var(--muted);padding:8px 16px;font-size:.9rem;cursor:pointer}
.pf-sort button.on{background:var(--gold);color:#0a2431;font-weight:700}
.pf-tools{display:flex;gap:8px}
.pf-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:9px 14px;font-size:.92rem;cursor:pointer}
.pf-btn:disabled{opacity:.45;cursor:default}
.pf-btn.pf-primary{background:var(--gold);border-color:var(--gold);color:#0a2431;font-weight:700}
.pf-btn.pf-ghost{background:transparent}
.pf-btn.pf-small{padding:6px 10px;font-size:.82rem}
.pf-btn.pf-danger{background:var(--red);border-color:var(--red);color:#0a2431;font-weight:700}
.pf-btn.pf-danger-link{background:transparent;border:0;color:var(--red);padding:9px 4px}
.pf-backdrop{position:fixed;inset:0;background:rgba(2,10,16,.62);z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.pf-backdrop{align-items:center;padding:24px}}
.pf-sheet{background:var(--bg-2);color:var(--text);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px}
@media(min-width:640px){.pf-sheet{border-radius:20px}}
.pf-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.pf-head .eyebrow{color:var(--gold);font-size:.78rem;letter-spacing:.08em;margin:0 0 2px}
.pf-head h2{margin:0;font-size:1.3rem}
.pf-close{border:1px solid var(--line);background:transparent;color:var(--text);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer}
.pf-field{display:block;margin:10px 0}
.pf-field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pf-field input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:1rem}
.pf-tabs{display:flex;gap:6px;margin:12px 0}
.pf-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 4px;font-size:.85rem;cursor:pointer}
.pf-tabs button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.pf-pane{margin-bottom:6px}
.pf-row{display:flex;gap:8px}
.pf-row input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:1rem;min-width:0}
.pf-col{display:flex;flex-direction:column;gap:10px}
.pf-coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-results{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pf-place-btn{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer}
.pf-place-btn strong{display:block}
.pf-place-btn span{font-size:.82rem;color:var(--muted)}
.pf-note{font-size:.85rem;color:var(--muted);margin:10px 0}
.pf-loc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.pf-loc span{font-size:.78rem;color:var(--muted);display:block}
.pf-loc strong{display:block;margin-top:2px}
.pf-loc small{color:var(--muted)}
.pf-reg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.pf-reg legend{font-size:.85rem;padding:0 6px}
.pf-reg>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pf-reg label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.pf-reg label.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.pf-reg input{position:absolute;opacity:0;pointer-events:none}
.pf-stations fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.pf-stations legend{font-size:.85rem;padding:0 6px}
.pf-radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:8px 0;cursor:pointer}
.pf-radio.on{border-color:var(--gold)}
.pf-radio input{margin-top:3px}
.pf-radio strong{display:block;font-size:.92rem}
.pf-radio small{color:var(--muted);font-size:.78rem}
.pf-msg{background:rgba(255,127,114,.12);border:1px solid var(--red);color:var(--text);border-radius:12px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.pf-msg.ok{background:rgba(123,216,161,.12);border-color:var(--green)}
.pf-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

</div>
<script>
(async()=>{
const SPOT_META=[
{"name":"Atlantic City, NJ","station":"8534720","lat":39.356667,"lng":-74.41805},
{"name":"Newport, RI","station":"8452660","lat":41.504333,"lng":-71.32614},
{"name":"225","station":"8517756","lat":40.5812,"lng":-73.9338},
{"name":"Belmar \u98de\u673a\u77f3","station":"8532337","lat":40.185,"lng":-74.0083},
{"name":"\u53f2\u5c9b\u6865\u5934","station":"8519050","lat":40.6030248,"lng":-74.053513,"regulationState":"NY"},
{"name":"Caumsett \u64d2\u77f3","station":"8515921","lat":40.9423791,"lng":-73.4779717,"regulationState":"NY"},
{"name":"\u957f\u5c9b Jones Beach","station":"8516225","stationName":"Deep Creek Meadow","lat":40.5976,"lng":-73.51485,"regulationState":"NY"},
{"name":"Viking \u8239\u9493 Block Island","station":"8459681","stationName":"Southwest Point, Block Island","lat":41.1573896,"lng":-71.7404752,"regulationState":"NY"},
{"name":"Seagate Brooklyn","station":"8517811","stationName":"Norton Point, Gravesend Bay","lat":40.5802704,"lng":-74.0107626,"regulationState":"NY"}
];
/* ===== Visitor features for the public live page =====
   Custom spots, sort mode (score / my order), preset visibility.
   Per-visitor settings, stored in the visitor's own browser (localStorage).
   Inlined into index.html by build_live.py, inside the same async IIFE. */

const PF_KEY = 'fishing_public_prefs_v1';

function __presetId(m) { return 'p:' + m.station; }
function __pfDefaults() { return { customSpots: [], hidden: [], sortMode: 'score', order: SPOT_META.map(__presetId) }; }
function __pfLoad() {
  try {
    const p = JSON.parse(localStorage.getItem(PF_KEY));
    if (p && Array.isArray(p.order) && Array.isArray(p.customSpots)) return Object.assign(__pfDefaults(), p);
  } catch (e) {}
  return __pfDefaults();
}
let PF = __pfLoad();
function __pfSave() { try { localStorage.setItem(PF_KEY, JSON.stringify(PF)); } catch (e) {} }
function __pfAllIds() { return SPOT_META.map(__presetId).concat(PF.customSpots.map(c => c.id)); }
function __pfSyncOrder() {
  const ids = new Set(__pfAllIds());
  PF.order = PF.order.filter(id => ids.has(id));
  for (const id of __pfAllIds()) if (!PF.order.includes(id)) PF.order.push(id);
}
function __pfMetas() {
  __pfSyncOrder();
  const hidden = new Set(PF.hidden);
  const out = [];
  for (const m of SPOT_META) {
    if (!hidden.has(__presetId(m))) out.push(Object.assign({}, m, { pid: __presetId(m), isCustom: false }));
  }
  for (const c of PF.customSpots) {
    out.push({ name: c.name, station: c.station, stationName: c.stationName, lat: c.lat, lng: c.lng, regulationState: c.regulationState, pid: c.id, isCustom: true });
  }
  return out;
}
function __pfSpotKey(metas) { return metas.map(m => m.pid + ':' + m.station).join('|'); }
function __pfPos(spot) {
  const pid = spot.pid || (spot.station ? __presetId(spot) : '');
  const i = PF.order.indexOf(pid);
  return i < 0 ? 9999 : i;
}
function __stateForMeta(m) {
  if (m.regulationState) return m.regulationState;
  if (m.name === 'Newport, RI') return 'RI';
  if (m.name === 'Sandy Hook, NJ' || m.name === 'Atlantic City, NJ' || m.name === 'Belmar \u98de\u673a\u77f3') return 'NJ';
  return 'NY';
}
function __suggestReg(lat, lng) {
  let best = null, bd = 1e9;
  for (const m of SPOT_META) {
    const d = __haversineKm(lat, lng, m.lat, m.lng);
    if (d < bd) { bd = d; best = m; }
  }
  return (best && bd < 60) ? __stateForMeta(best) : 'OTHER';
}

/* ---------- NOAA station matching ---------- */
function __haversineKm(a, b, c, d) {
  const r = x => x * Math.PI / 180, dLa = r(c - a), dLo = r(d - b);
  const v = Math.sin(dLa / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLo / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(v), Math.sqrt(1 - v));
}
let __stationCache = null;
async function __loadStations() {
  if (__stationCache) return __stationCache;
  const j = await __fetchJSON('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions');
  __stationCache = j.stations
    .filter(s => s.lat != null && s.lng != null)
    .map(s => ({ id: String(s.id), name: s.name, lat: +s.lat, lng: +s.lng }));
  return __stationCache;
}
function __nearestStations(lat, lng, n) {
  return __stationCache
    .map(s => ({ id: s.id, name: s.name, lat: s.lat, lng: s.lng, d: __haversineKm(lat, lng, s.lat, s.lng) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, n || 5);
}

/* ---------- place search / maps link ---------- */
async function __searchPlaces(q) {
  const p = new URLSearchParams({ name: q, count: '6', language: 'zh', format: 'json' });
  const j = await __fetchJSON('https://geocoding-api.open-meteo.com/v1/search?' + p.toString());
  return (j.results || []).map(r => ({
    name: r.name,
    label: [r.name, r.admin1, r.country].filter(Boolean).join(' \u00b7 '),
    lat: r.latitude, lng: r.longitude
  }));
}
function __coordPair(v) {
  if (!v) return null;
  const m = String(v).match(/(-?\d{1,2}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) ? { lat, lng } : null;
}
function __mapsCoords(u) {
  const at = decodeURIComponent(u.pathname).match(/\/@(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?),/);
  if (at) { const c = __coordPair(at[1] + ',' + at[2]); if (c) return c; }
  for (const k of ['q', 'query', 'll']) { const c = __coordPair(u.searchParams.get(k)); if (c) return c; }
  const dv = u.searchParams.get('data') || decodeURIComponent(u.pathname);
  const dm = dv.match(/!3d(-?\d{1,2}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/);
  if (dm) return __coordPair(dm[1] + ',' + dm[2]);
  return null;
}
function __mapsLabel(u) {
  const pm = u.pathname.match(/\/maps\/(?:place|search)\/([^/]+)/i);
  let label = (pm && pm[1]) ? decodeURIComponent(pm[1]).replace(/\+/g, ' ').trim() : '';
  if (!label) for (const k of ['q', 'query']) {
    const v = (u.searchParams.get(k) || '').trim();
    if (v && !__coordPair(v)) { label = v; break; }
  }
  return label ? label.slice(0, 80) : null;
}
function __parseMapsLink(raw) {
  let u;
  try { u = new URL(raw.trim()); } catch (e) { return { error: '\u94fe\u63a5\u65e0\u6548\uff0c\u8bf7\u68c0\u67e5\u540e\u91cd\u8bd5' }; }
  if (u.protocol !== 'https:') return { error: '\u94fe\u63a5\u65e0\u6548\uff0c\u8bf7\u68c0\u67e5\u540e\u91cd\u8bd5' };
  if (u.hostname === 'maps.app.goo.gl') return { error: '\u77ed\u94fe\u63a5\u5728\u7f51\u9875\u7248\u65e0\u6cd5\u76f4\u63a5\u89e3\u6790\uff1a\u8bf7\u7528 Google Maps \u6253\u5f00\u8be5\u94fe\u63a5\uff0c\u518d\u590d\u5236\u6d4f\u89c8\u5668\u5730\u5740\u680f\u7684\u5b8c\u6574\u94fe\u63a5\u7c98\u8d34\u5230\u8fd9\u91cc' };
  if (!['google.com', 'www.google.com', 'maps.google.com'].includes(u.hostname)) return { error: '\u8bf7\u8f93\u5165 Google Maps \u5206\u4eab\u94fe\u63a5' };
  const c = __mapsCoords(u);
  if (!c) return { error: '\u94fe\u63a5\u91cc\u6ca1\u6709\u627e\u5230\u5750\u6807\uff0c\u8bf7\u68c0\u67e5\u94fe\u63a5\u662f\u5426\u6709\u6548\uff0c\u6216\u6539\u7528\u641c\u5730\u540d/\u8f93\u7ecf\u7eac\u5ea6' };
  return { lat: c.lat, lng: c.lng, label: __mapsLabel(u) || (c.lat.toFixed(5) + ', ' + c.lng.toFixed(5)) };
}

/* ---------- private spot-add log (owner only) ---------- */
const PF_LOG_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdbouebGYgQ9IMh3K8RTBRraFoeqc21HbcG2yet0dUUA-I7Gg/formResponse';
const PF_LOG_ENTRY = 'entry.426974509';
function __logSpot(c) {
  try {
    const body = new URLSearchParams();
    body.set(PF_LOG_ENTRY, c.name + ' | ' + c.lat + ', ' + c.lng + ' | ' + c.stationName + ' (' + c.station + ') | ' + c.regulationState);
    fetch(PF_LOG_URL, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
  } catch (e) {}
}

/* ---------- sheets ---------- */
const PF_REG_LABELS = { NY: 'NY \u7ebd\u7ea6\u5dde', NJ: 'NJ \u65b0\u6cfd\u897f\u5dde', RI: 'RI \u7f57\u5fb7\u5c9b\u5dde', OTHER: '\u5176\u4ed6' };
function __regPickerHTML(value, note, group) {
  const g = group || 'pf-reg';
  return '<fieldset class="pf-reg"><legend>\u9002\u7528\u6cd5\u89c4\u5dde</legend>' +
    (note ? '<p class="pf-note">' + esc(note) + '</p>' : '') +
    '<div>' + ['NY', 'NJ', 'RI', 'OTHER'].map(s =>
      '<label class="' + (value === s ? 'on' : '') + '"><input type="radio" name="' + g + '" value="' + s + '"' + (value === s ? ' checked' : '') + '><span>' + PF_REG_LABELS[s] + '</span></label>'
    ).join('') + '</div></fieldset>';
}
function __openBackdrop(html) {
  __closeSheets();
  const bd = document.createElement('div');
  bd.className = 'pf-backdrop';
  bd.innerHTML = html;
  bd.addEventListener('mousedown', e => { if (e.target === bd) __closeSheets(); });
  document.body.appendChild(bd);
  const dlg = bd.querySelector('.pf-sheet');
  const close = bd.querySelector('.pf-close');
  if (close) close.addEventListener('click', __closeSheets);
  return bd;
}
function __closeSheets() {
  document.querySelectorAll('.pf-backdrop').forEach(el => el.remove());
}
function __pfMsg(bd, text, ok) {
  const el = bd.querySelector('.pf-msg');
  if (!text) { el.hidden = true; el.textContent = ''; return; }
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle('ok', !!ok);
}
function __readReg(bd) {
  const checked = bd.querySelector('.pf-reg input:checked');
  return checked ? checked.value : 'OTHER';
}

/* ----- Add spot sheet ----- */
function __openAddSpot() {
  const bd = __openBackdrop(
    '<section class="pf-sheet" role="dialog" aria-modal="true" aria-label="\u6dfb\u52a0\u9493\u70b9">' +
    '<div class="pf-head"><div><p class="eyebrow">\u81ea\u5b9a\u4e49\u5730\u70b9</p><h2>\u6dfb\u52a0\u9493\u70b9</h2></div>' +
    '<button type="button" class="pf-close" aria-label="\u5173\u95ed">\u00d7</button></div>' +
    '<label class="pf-field"><span>\u9493\u70b9\u540d\u79f0</span><input id="pf-name" maxlength="40" placeholder="\u4f8b\u5982\uff1a\u6211\u5bb6\u95e8\u53e3\u7684\u7801\u5934"></label>' +
    '<div class="pf-tabs" role="tablist" aria-label="\u9009\u62e9\u4f4d\u7f6e\u65b9\u5f0f">' +
    '<button type="button" data-tab="search" class="on">\u641c\u5730\u540d</button>' +
    '<button type="button" data-tab="coords">\u7ecf\u7eac\u5ea6</button>' +
    '<button type="button" data-tab="maps">\u5730\u56fe\u94fe\u63a5</button>' +
    '<button type="button" data-tab="current">\u5f53\u524d\u4f4d\u7f6e</button></div>' +
    '<div class="pf-pane" data-pane="search"><form id="pf-search-form" class="pf-row">' +
    '<input id="pf-search-q" placeholder="\u57ce\u5e02\u3001\u6d77\u6ee9\u6216\u7801\u5934\u9644\u8fd1\u5730\u540d" aria-label="\u8f93\u5165\u5730\u540d">' +
    '<button type="submit" class="pf-btn">\u641c\u7d22</button></form><div id="pf-search-results" class="pf-results"></div></div>' +
    '<div class="pf-pane" data-pane="coords" hidden><div class="pf-coord-grid">' +
    '<label class="pf-field"><span>\u7eac\u5ea6</span><input id="pf-lat" inputmode="decimal" placeholder="39.3600"></label>' +
    '<label class="pf-field"><span>\u7ecf\u5ea6</span><input id="pf-lng" inputmode="decimal" placeholder="-74.4300"></label></div>' +
    '<button type="button" id="pf-coords-go" class="pf-btn">\u5339\u914d\u6f6e\u6c50\u7ad9</button></div>' +
    '<div class="pf-pane" data-pane="maps" hidden><form id="pf-maps-form" class="pf-col">' +
    '<label class="pf-field"><span>Google Maps \u5206\u4eab\u94fe\u63a5</span>' +
    '<input id="pf-maps-link" type="url" placeholder="\u7c98\u8d34 google.com/maps \u5b8c\u6574\u94fe\u63a5\uff08\u77ed\u94fe\u63a5\u8bf7\u5148\u5728\u6d4f\u89c8\u5668\u6253\u5f00\u518d\u590d\u5236\u5730\u5740\u680f\uff09"></label>' +
    '<button type="submit" class="pf-btn">\u89e3\u6790\u94fe\u63a5</button></form></div>' +
    '<div class="pf-pane" data-pane="current" hidden><p class="pf-note">\u4f7f\u7528\u8bbe\u5907\u4f4d\u7f6e\u53ea\u7528\u4e8e\u5339\u914d\u5929\u6c14\u3001\u6d77\u51b5\u548c\u9644\u8fd1\u6f6e\u6c50\u7ad9\u3002</p>' +
    '<button type="button" id="pf-geo-go" class="pf-btn">\u4f7f\u7528\u6211\u7684\u5f53\u524d\u4f4d\u7f6e</button></div>' +
    '<div id="pf-loc" class="pf-loc" hidden></div>' +
    '<div id="pf-regwrap" hidden></div>' +
    '<div id="pf-stations" class="pf-stations" hidden></div>' +
    '<div class="pf-msg" role="alert" hidden></div>' +
    '<div class="pf-actions"><button type="button" class="pf-btn pf-ghost" id="pf-cancel">\u53d6\u6d88</button>' +
    '<button type="button" class="pf-btn pf-primary" id="pf-save" disabled>\u4fdd\u5b58\u9493\u70b9</button></div>' +
    '</section>'
  );
  const $ = sel => bd.querySelector(sel);
  const state = { loc: null, stations: [], stationId: '', reg: 'OTHER', busy: false };

  bd.querySelectorAll('.pf-tabs button').forEach(btn => btn.addEventListener('click', () => {
    bd.querySelectorAll('.pf-tabs button').forEach(b => b.classList.toggle('on', b === btn));
    bd.querySelectorAll('.pf-pane').forEach(p => { p.hidden = p.dataset.pane !== btn.dataset.tab; });
    __pfMsg(bd, '');
  }));
  $('#pf-cancel').addEventListener('click', __closeSheets);

  async function chooseLocation(lat, lng, label, suggestedName) {
    state.loc = { lat, lng, label };
    state.stations = []; state.stationId = '';
    state.reg = __suggestReg(lat, lng);
    const nameInput = $('#pf-name');
    if (!nameInput.value.trim() && suggestedName) nameInput.value = suggestedName.slice(0, 40);
    const locBox = $('#pf-loc');
    locBox.hidden = false;
    locBox.innerHTML = '<span>\u6240\u9009\u4f4d\u7f6e</span><strong>' + esc(label) + '</strong><small>' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</small>';
    const regWrap = $('#pf-regwrap');
    regWrap.hidden = false;
    regWrap.innerHTML = __regPickerHTML(state.reg, '已按附近预设钓点自动选择；州界附近请按实际作钓水域确认。', 'pf-reg-add');
    regWrap.querySelectorAll('input').forEach(r => r.addEventListener('change', () => { state.reg = r.value; }));
    $('#pf-save').disabled = true;
    const stBox = $('#pf-stations');
    stBox.hidden = false;
    stBox.innerHTML = '<p class="pf-note">\u6b63\u5728\u4ece NOAA \u7ad9\u70b9\u5217\u8868\u4e2d\u5339\u914d\u6700\u8fd1\u6f6e\u6c50\u7ad9\u2026</p>';
    __pfMsg(bd, '');
    try {
      await __loadStations();
      state.stations = __nearestStations(lat, lng, 5);
      state.stationId = state.stations[0] ? state.stations[0].id : '';
      if (!state.stations.length) { stBox.innerHTML = ''; __pfMsg(bd, '\u9644\u8fd1\u6ca1\u6709\u53ef\u7528\u7684\u6f6e\u6c50\u7ad9'); return; }
      stBox.innerHTML = '<fieldset><legend>\u9009\u62e9\u6f6e\u6c50\u7ad9</legend><p class="pf-note">\u5df2\u81ea\u52a8\u9009\u4e2d\u6700\u8fd1\u7ad9\uff0c\u4e5f\u53ef\u4ee5\u6362\u4e00\u4e2a\u3002</p>' +
        state.stations.map((s, i) => '<label class="pf-radio' + (s.id === state.stationId ? ' on' : '') + '">' +
          '<input type="radio" name="pf-station" value="' + esc(s.id) + '"' + (s.id === state.stationId ? ' checked' : '') + '>' +
          '<span><strong>' + esc(s.name) + '</strong><small>' + (i === 0 ? '\u6700\u8fd1 \u00b7 ' : '') + s.d.toFixed(1) + ' km \u00b7 NOAA ' + esc(s.id) + '</small></span></label>').join('') +
        '</fieldset>';
      stBox.querySelectorAll('input').forEach(r => r.addEventListener('change', () => {
        state.stationId = r.value;
        stBox.querySelectorAll('.pf-radio').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
        $('#pf-save').disabled = false;
      }));
      $('#pf-save').disabled = false;
    } catch (e) {
      stBox.innerHTML = '';
      __pfMsg(bd, '\u6f6e\u6c50\u7ad9\u5339\u914d\u5931\u8d25\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5');
    }
  }

  $('#pf-search-form').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#pf-search-q').value.trim();

  if (custom) return { id, name: custom.name, sub: '\u81ea\u5b9a\u4e49 \u00b7 ' + custom.stationName, isCustom: true };
  const m = SPOT_META.find(x => __presetId(x) === id);
  if (m) return { id, name: m.name, sub: '\u9884\u8bbe \u00b7 NOAA ' + m.station, isCustom: false };
  return null;
}
function __openManageAll() {

    '<section class="pf-sheet" role="dialog" aria-modal="true" aria-label="\u7ba1\u7406\u9493\u70b9">' +

  );
  const $ = sel => bd.querySelector(sel);
  function paintRows() {
    const box = $('#pf-rows');

      const meta = __pfRowMeta(id);

      const hidden = !meta.isCustom && PF.hidden.includes(id);
      const row = document.createElement('div');
      row.className = 'pf-row-item' + (hidden ? ' is-hidden' : '');
      row.innerHTML =
        '<div class="pf-order-btns"><button type="button" aria-label="\u4e0a\u79fb ' + esc(meta.name) + '"' + (idx === 0 ? ' disabled' : '') + '>\u2191</button>' +
        '<button type="button" aria-label="\u4e0b\u79fb ' + esc(meta.name) + '"' + (idx === PF.order.length - 1 ? ' disabled' : '') + '>\u2193</button></div>' +
        '<div class="pf-row-copy"><strong>' + esc(meta.name) + '</strong><small>' + esc(meta.sub) + '</small></div>' +
        '<div class="pf-row-act"></div>';
      const [up, down] = row.querySelectorAll('.pf-order-btns button');
      up.addEventListener('click', () => moveSpot(idx, -1));
      down.addEventListener('click', () => moveSpot(idx, 1));
      const act = row.querySelector('.pf-row-act');
      if (meta.isCustom) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'pf-btn pf-ghost pf-small'; b.textContent = '\u7f16\u8f91';
        b.addEventListener('click', () => __openManageSpot(id));
        act.appendChild(b);
      } else {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pf-visibility' + (hidden ? '' : ' on');
        b.setAttribute('role', 'switch');
        b.setAttribute('aria-checked', String(!hidden));
        b.setAttribute('aria-label', (hidden ? '\u663e\u793a ' : '\u9690\u85cf ') + meta.name);
        b.innerHTML = '<span aria-hidden="true"></span><b>' + (hidden ? '\u5df2\u9690\u85cf' : '\u663e\u793a\u4e2d') + '</b>';
        b.addEventListener('click', async () => {
          if (hidden) PF.hidden = PF.hidden.filter(x => x !== id);
          else PF.hidden.push(id);
          __pfSave();
          __pfMsg(bd, '', true);
          paintRows();
          await __refreshSpots();
          __openManageAll();
        });
        act.appendChild(b);
      }
      box.appendChild(row);
    });
  }
  function moveSpot(idx, dirn) {
    const t = idx + dirn;
    if (t < 0 || t >= PF.order.length) return;
    const next = PF.order.slice();
    const tmp = next[idx]; next[idx] = next[t]; next[t] = tmp;
    PF.order = next;
    __pfSave();
    __pfMsg(bd, '\u987a\u5e8f\u5df2\u4fdd\u5b58', true);
    paintRows();
    renderHome();
  }
  paintRows();
}

const __CACHE_KEY='fishing_public_live_v2';
const __CACHE_TTL=3600*1000;
function __etParts(d){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const o={}; for(const x of p) o[x.type]=x.value; return o;
}
function __ymd(d){ const o=__etParts(d); return o.year+o.month+o.day; }
function __etISO(d){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);
  const o={}; for(const x of p) o[x.type]=x.value;
  return o.year+'-'+o.month+'-'+o.day+'T'+o.hour+':'+o.minute+':'+o.second;
}
function __readCache(){
  try{
    if(typeof localStorage==='undefined') return null;
    const raw=localStorage.getItem(__CACHE_KEY); if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function __saveCache(data,key){
  try{ if(typeof localStorage!=='undefined') localStorage.setItem(__CACHE_KEY,JSON.stringify({savedAt:Date.now(),key,data})); }catch(e){}
}
async function __fetchJSON(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status+' '+url);
  return r.json();
}
function __noaaURL(station,beginYMD,endYMD,interval){
  const p=new URLSearchParams({product:'predictions',application:'NOS.COOPS.TAC.WL',begin_date:beginYMD,end_date:endYMD,datum:'MLLW',station:station,time_zone:'lst_ldt',units:'english',interval:interval,format:'json'});
  return 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?'+p.toString();
}
function __tmin(s){ return Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),+s.slice(11,13),+s.slice(14,16))/60000; }
function __fmtBack(m){
  const d=new Date(m*60000), p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());
}
function __interpHourly(hilo,dayYMD){
  const pts=hilo.map(p=>({m:__tmin(p.t),v:parseFloat(p.v)})).sort((a,b)=>a.m-b.m);
  const startM=__tmin(dayYMD.slice(0,4)+'-'+dayYMD.slice(4,6)+'-'+dayYMD.slice(6,8)+' 00:00');
  const out=[];
  for(let n=0;n<168;n++){
    const m=startM+n*60;
    let a,b;
    if(m<=pts[0].m){ a=pts[0]; b=pts[1]; }
    else if(m>=pts[pts.length-1].m){ a=pts[pts.length-2]; b=pts[pts.length-1]; }
    else{ for(let k=0;k<pts.length-1;k++){ if(pts[k].m<=m&&m<=pts[k+1].m){ a=pts[k]; b=pts[k+1]; break; } } }
    const frac=(m-a.m)/(b.m-a.m);
    const v=a.v+(b.v-a.v)*(1-Math.cos(Math.PI*frac))/2;
    out.push({t:__fmtBack(m),v:v.toFixed(3)});
  }
  return out;
}
function __pick(o,keys){ const r={}; for(const k of keys) r[k]=o[k]; return r; }
async function __fetchSpot(meta,beginYMD,endYMD,dayYMD){
  const wxQ=new URLSearchParams({latitude:meta.lat,longitude:meta.lng,
    current:'temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly:'temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,wind_speed_10m_max,precipitation_probability_max,wind_direction_10m_dominant',
    temperature_unit:'fahrenheit',wind_speed_unit:'mph',precipitation_unit:'inch',
    timezone:'America/New_York',forecast_days:'7'}).toString();
  const marQ=new URLSearchParams({latitude:meta.lat,longitude:meta.lng,
    hourly:'wave_height,swell_wave_height,swell_wave_direction,sea_surface_temperature',
    temperature_unit:'fahrenheit',timezone:'America/New_York',forecast_days:'7'}).toString();
  const [hiloJ,hourlyJ,wxJ,marJ]=await Promise.all([
    __fetchJSON(__noaaURL(meta.station,beginYMD,endYMD,'hilo')),
    __fetchJSON(__noaaURL(meta.station,beginYMD,endYMD,'h')),
    __fetchJSON('https://api.open-meteo.com/v1/forecast?'+wxQ),
    __fetchJSON('https://marine-api.open-meteo.com/v1/marine?'+marQ)
  ]);
  if(hiloJ.error) throw new Error('NOAA hilo: '+hiloJ.error.message);
  if(wxJ.error) throw new Error('Open-Meteo: '+JSON.stringify(wxJ.error).slice(0,120));
  if(marJ.error) throw new Error('Open-Meteo marine: '+JSON.stringify(marJ.error).slice(0,120));
  let hourlyTide;
  if(hourlyJ.error){
    if(!/No Predictions/i.test(hourlyJ.error.message)) throw new Error('NOAA hourly: '+hourlyJ.error.message);
    hourlyTide=__interpHourly(hiloJ.predictions,dayYMD);
  }else{
    hourlyTide=hourlyJ.predictions.slice(0,168).map(p=>({t:p.t,v:p.v}));
  }
  const spot={name:meta.name,station:meta.station,lat:meta.lat,lng:meta.lng};
  if(meta.pid) spot.pid=meta.pid;
  if(meta.isCustom) spot.isCustom=true;
  if(meta.stationName) spot.stationName=meta.stationName;
  if(meta.regulationState) spot.regulationState=meta.regulationState;
  spot.status='ok'; spot.errors=[];
  spot.tide={hilo:hiloJ.predictions.map(p=>({t:p.t,v:p.v,type:p.type})),hourly:hourlyTide};
  spot.weather={
    current:__pick(wxJ.current,['time','interval','temperature_2m','weather_code','wind_speed_10m','wind_direction_10m','wind_gusts_10m']),
    hourly:__pick(wxJ.hourly,['time','temperature_2m','precipitation_probability','weather_code','wind_speed_10m','wind_direction_10m','wind_gusts_10m']),
    daily:__pick(wxJ.daily,['time','weather_code','temperature_2m_max','temperature_2m_min','sunrise','sunset','wind_speed_10m_max','precipitation_probability_max','wind_direction_10m_dominant'])
  };
  spot.marine={hourly:__pick(marJ.hourly,['time','wave_height','swell_wave_height','swell_wave_direction','sea_surface_temperature'])};
  if(spot.tide.hourly.length!==168||spot.weather.hourly.time.length!==168||spot.weather.daily.time.length!==7||spot.marine.hourly.time.length!==168)
    throw new Error('incomplete series for '+meta.name);
  return spot;
}
function __showLoading(){
  const el=document.getElementById('live-loading');
  if(el) el.style.display='flex';
}
function __hideLoading(){
  const el=document.getElementById('live-loading');
  if(el) el.remove();
}
function __showError(msg){
  const el=document.getElementById('live-loading');
  if(el) el.innerHTML='<div style="text-align:center;max-width:22rem"><p style="font-size:1.05rem;margin:0 0 .6rem">数据获取失败，请检查网络后重试</p><p style="opacity:.65;font-size:.85rem;margin:0 0 1rem">'+String(msg).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()" style="padding:.6rem 1.6rem;border-radius:999px;border:1px solid #f2c760;background:transparent;color:inherit;font-size:1rem">重试</button></div>';
}
async function __loadData(){
  const metas=__pfMetas();
  const key=__pfSpotKey(metas);
  const cache=__readCache();
  const fresh=cache&&cache.key===key&&(Date.now()-cache.savedAt<__CACHE_TTL);
  if(fresh) return {data:cache.data,fromCache:true};
  __showLoading();

      if (fraction < .53) return '满月';
      if (fraction < .72) return '亏凸月';
      if (fraction < .78) return '下弦月';
      return '残月';
    }
    function weekday(date) {
      const names = ['周日','周一','周二','周三','周四','周五','周六'];
      return names[new Date(`${date}T12:00:00-04:00`).getUTCDay()];
    }
    function dayLabel(date, index) {
      if (index === 0) return '今天';
      if (index === 1) return '明天';
      return weekday(date);
    }
    function makeDateStrip(spot, selectedIndex) {
      return spot.weather.daily.time.slice(0,7).map((date,index) => `<button class="date-chip" type="button" data-day-index="${index}" aria-pressed="${index === selectedIndex}">
        <b>${dayLabel(date,index)}</b><small>${Number(date.slice(5,7))}月${Number(date.slice(8,10))}日</small>
      </button>`).join('');
    }
    function tideEventsForDate(spot, date) {
      return spot.tide.hilo.filter(x => x.t.slice(0,10) === date);
    }
    function makeTideEvents(spot, date) {
      const events = tideEventsForDate(spot,date);
      if (!events.length) return '<p class="tide-empty">这一天暂无高低潮数据。</p>';
      return events.map(x => `<div class="tide-event ${x.type === 'H' ? 'high' : ''}">
        <div><b>${x.type === 'H' ? '高潮' : '低潮'}</b><small>${Number(x.t.slice(5,7))}月${Number(x.t.slice(8,10))}日</small></div>
        <div><time>${timeOnly(x.t)}</time><small>${n(x.v)} ft</small></div>
      </div>`).join('');
    }
    function dayAdvice(spot, date, index) {
      const weather = spot.weather.hourly;
      const marine = spot.marine.hourly;
      const wi = weather.time.map((t,i) => t.slice(0,10) === date ? i : -1).filter(i => i >= 0);
      const mi = marine.time.map((t,i) => t.slice(0,10) === date ? i : -1).filter(i => i >= 0);
      const maxOf = (values, indices) => {
        const nums = indices.map(i => Number(values[i])).filter(Number.isFinite);
        return nums.length ? Math.max(...nums) : 0;
      };
      const wind = maxOf(weather.wind_speed_10m,wi);
      const gust = maxOf(weather.wind_gusts_10m || [],wi);
      const rain = maxOf(weather.precipitation_probability,wi);
      const wave = maxOf(marine.wave_height,mi);
      let score = 92;
      score -= Math.max(0,wind-8)*2.1;
      score -= Math.max(0,gust-18)*1.15;
      score -= Math.max(0,wave-1.5)*10;
      score -= rain*.09;
      score = Math.max(20,Math.min(98,Math.round(score)));
      const label = index === 0 ? '今天' : `${Number(date.slice(5,7))}月${Number(date.slice(8,10))}日`;
      let advice;
      if (wind >= 20 || wave >= 5) advice = `${label}风浪偏大，建议改期或选择避风岸线。`;
      else if (score >= 78) advice = `${label}风浪温和，适合关注高潮前后的窗口。`;
      else if (score >= 60) advice = `${label}条件尚可，尽量避开阵风较强的时段。`;
      else advice = `${label}条件一般，近岸作钓也请先观察现场风浪。`;
      return {score,advice};
    }
    function makeHours(spot,d) {
      const h = spot.weather.hourly;
      const m = spot.marine.hourly;
      const start = d.wi;
      return h.time.slice(start,start+24).map((t,j) => {
        const i = start+j;
        const mi = nearestIndex(m.time,t);
        return `<div class="hour">
          <time>${j===0?'现在':timeOnly(t)}</time>
          <span class="hour-temp">${n(h.temperature_2m[i],0)}°</span>
          <small>${weatherName(h.weather_code[i])} · 降水 ${n(h.precipitation_probability[i],0)}%</small>
          <small>${windReading(h.wind_direction_10m[i],h.wind_speed_10m[i])}</small>
          <small>浪 ${n(m.wave_height[mi])} · 涌 ${n(m.swell_wave_height[mi])} ft</small>
          <small>海温 ${n(m.sea_surface_temperature[mi],0)}°F</small>
        </div>`;
      }).join('');
    }
    function makeForecast(spot) {
      const d = spot.weather.daily;
      return d.time.map((date,i) => `<div class="day">
        <div class="day-name">${i===0?'今天':weekday(date)}</div>
        <div class="day-main"><b>${weatherName(d.weather_code[i])}</b><small>降水 ${n(d.precipitation_probability_max[i],0)}% · ${windReading(d.wind_direction_10m_dominant?.[i],d.wind_speed_10m_max[i])}</small></div>
        <div class="day-temp"><b>${n(d.temperature_2m_max[i],0)}°</b><small>${n(d.temperature_2m_min[i],0)}°F</small></div>
      </div>`).join('');
    }
    function showDetail(index, selectedIndex=0, shouldScroll=true) {
      const spot = DATA.spots[index];
      const d = derive(spot);
      if (d.failed) return;
      const c = spot.weather.current;
      const daily = spot.weather.daily;
      selectedIndex = Math.max(0,Math.min(selectedIndex,daily.time.length-1));
      const selectedDate = daily.time[selectedIndex];
      const selectedAdvice = dayAdvice(spot,selectedDate,selectedIndex);
      const selectedSea = seaTemperatureForDate(spot,selectedDate);
      const events = tideEventsForDate(spot,selectedDate);
      const highs = events.filter(x => x.type === 'H').length;
      const lows = events.filter(x => x.type === 'L').length;
      const tideStatus = selectedIndex === 0
        ? `<div class="now-stat"><span>${d.rising?'涨潮中':'落潮中'}</span><b>${n(d.currentTide)} ft</b></div>`
        : `<div class="now-stat"><span>当天高低潮</span><b>${highs} 高 · ${lows} 低</b></div>`;
      const curveNote = spot.tide.curveSource === 'hilo-cosine'
        ? '曲线按 NOAA 真实高低潮时间与潮高插值；潮位单位 ft，基准 MLLW'
        : '选择日期查看当天潮汐；潮位单位 ft，基准 MLLW';
      document.getElementById('detail-content').innerHTML = `<article class="detail-hero">
        <div class="detail-title"><div><h1>${esc(spot.name)}</h1><p>NOAA 站 ${esc(spot.station)} · ${weatherName(c.weather_code)}</p></div><div class="detail-score">${d.score}<small>当前评分 · ${scoreLabel(d.score)}</small></div></div>
        <div class="now-grid">
          ${tideStatus}
          <div class="now-stat"><span>风向 / 风速</span><b>${windReading(c.wind_direction_10m,c.wind_speed_10m)}</b><small class="gust-line">阵风 ${n(c.wind_gusts_10m,0)} mph</small></div>
          <div class="now-stat"><span>浪 / 涌浪</span><b>${n(d.wave)} / ${n(d.swell)} ft</b></div>
          <div class="now-stat"><span>海水温度</span><b>${n(d.sea,0)}°F</b></div>
        </div>
        <p class="advice" id="day-advice">${esc(selectedAdvice.advice)} <small>出钓建议仅供参考。</small></p>
      </article>
      <div class="detail-layout">
        <section class="panel chart-panel"><h2>${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8,10))}日潮汐</h2><p class="panel-sub">${curveNote}</p><div class="date-strip" aria-label="选择潮汐日期">${makeDateStrip(spot,selectedIndex)}</div><div class="chart-wrap"><canvas id="tide-chart" role="img" aria-label="${esc(spot.name)} ${esc(selectedDate)} 潮汐曲线"></canvas></div><div class="legend"><span><i></i>潮位曲线</span><span><i class="gold"></i>高潮 / 低潮</span></div></section>
        <section class="panel"><h2>当天高低潮</h2><p class="panel-sub">${weekday(selectedDate)} · 美国东部时间</p><div class="tide-table">${makeTideEvents(spot,selectedDate)}</div></section>
        <section class="panel"><h2>今天的光照与月相</h2><p class="panel-sub">适合安排清晨和傍晚窗口</p><div class="sun-moon"><div><span>日出</span><b>${timeOnly(daily.sunrise[0])}</b></div><div><span>日落</span><b>${timeOnly(daily.sunset[0])}</b></div><div><span>月相</span><b>${moonPhase(daily.time[0])}</b></div></div></section>
        <section class="panel season-panel"><h2>时令鱼种参考</h2><p class="panel-sub">${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8,10))}日 · ${spotState(spot)} 法规 · 当天平均海温 ${Number.isFinite(selectedSea) ? `${n(selectedSea,0)}°F` : '暂无'}</p><div class="fish-list">${makeFishList(spot,selectedDate)}</div><p class="fish-footnote">根据季节与水温推测，仅供参考。${regulationSources()}</p></section>
      </div>
      <section class="panel"><h2>未来 24 小时</h2><p class="panel-sub">逐小时天气、风、浪、涌浪和海水温度</p><div class="hour-grid">${makeHours(spot,d)}</div></section>
      <section class="panel"><h2>7 天预报</h2><p class="panel-sub">每日最高 / 最低气温与最大风速</p><div class="forecast">${makeForecast(spot)}</div></section>`;
      document.getElementById('home').classList.add('hidden');
      document.getElementById('detail').classList.add('active');
      document.querySelectorAll('.date-chip').forEach(chip => chip.addEventListener('click',() => showDetail(index,Number(chip.dataset.dayIndex),false)));
      if (shouldScroll) window.scrollTo({top:0,behavior:'instant'});
      drawTideChart(spot,selectedDate);
      requestAnimationFrame(() => {
        const strip = document.querySelector('.date-strip');
        const selected = strip?.querySelector('[aria-pressed="true"]');
        if (strip && selected) strip.scrollLeft = selected.offsetLeft - strip.clientWidth/2 + selected.clientWidth/2;
      });
    }
    function showHome() {
      document.getElementById('detail').classList.remove('active');
      document.getElementById('home').classList.remove('hidden');
      if (activeChartResize) { window.removeEventListener('resize', activeChartResize); activeChartResize = null; }
      window.scrollTo({top:0,behavior:'instant'});
    }

    function drawTideChart(spot,date) {
      const canvas = document.getElementById('tide-chart');
      const series = spot.tide.hourly.filter(point => point.t.slice(0,10) === date);
      if (!canvas || series.length < 2) return;
      const draw = () => {
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width*ratio));
        canvas.height = Math.max(1, Math.round(rect.height*ratio));
        const ctx = canvas.getContext('2d'); ctx.scale(ratio,ratio);
        const w=rect.width,h=rect.height,p={l:38,r:12,t:18,b:32};
        const vals=series.map(x=>Number(x.v)); const min=Math.min(...vals)-.35,max=Math.max(...vals)+.35;
        const x=i=>p.l+i*(w-p.l-p.r)/(series.length-1); const y=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min);
        const style=getComputedStyle(document.documentElement); const line=style.getPropertyValue('--line').trim(); const muted=style.getPropertyValue('--muted').trim(); const cyan=style.getPropertyValue('--cyan').trim(); const gold=style.getPropertyValue('--gold').trim();
        ctx.clearRect(0,0,w,h); ctx.font='11px ui-sans-serif'; ctx.fillStyle=muted; ctx.strokeStyle=line; ctx.lineWidth=1;
        for(let i=0;i<=3;i++){const value=min+(max-min)*i/3,yy=y(value);ctx.beginPath();ctx.moveTo(p.l,yy);ctx.lineTo(w-p.r,yy);ctx.stroke();ctx.fillText(`${value.toFixed(1)} ft`,0,yy+4);}
        for(let i=0;i<series.length;i+=6){ctx.fillText(series[i].t.slice(11,16),Math.max(p.l,x(i)-12),h-8);}
        const grad=ctx.createLinearGradient(0,p.t,0,h-p.b);grad.addColorStop(0,'rgba(98,211,232,.28)');grad.addColorStop(1,'rgba(98,211,232,.02)');
        ctx.beginPath(); series.forEach((pt,i)=>{const xx=x(i),yy=y(Number(pt.v));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}); ctx.lineTo(x(series.length-1),h-p.b);ctx.lineTo(x(0),h-p.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
        ctx.beginPath(); series.forEach((pt,i)=>{const xx=x(i),yy=y(Number(pt.v));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.strokeStyle=cyan;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
        const start=new Date(series[0].t.replace(' ','T')); const end=new Date(series[series.length-1].t.replace(' ','T'));
        spot.tide.hilo.forEach(ev=>{const dt=new Date(ev.t.replace(' ','T'));if(dt<start||dt>end)return;const pos=(dt-start)/(end-start)*(series.length-1);ctx.beginPath();ctx.arc(x(pos),y(Number(ev.v)),4.5,0,Math.PI*2);ctx.fillStyle=ev.type==='H'?gold:cyan;ctx.fill();});
      };
      draw();
      if (activeChartResize) window.removeEventListener('resize',activeChartResize);
      activeChartResize = draw;
      window.addEventListener('resize',draw,{passive:true});
    }

    document.getElementById('back').addEventListener('click',showHome);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('detail').classList.contains('active'))showHome();});
    __initPublicFeatures();
    renderHome();
  
})();
</script>
</body>
